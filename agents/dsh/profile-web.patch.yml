# ============================================================
# web profile 补丁层   ~/.dsh/profiles/web/cordis.patch.yml
# 在 bundle 层之后生效
#
# 注意：补丁是「整键替换」而非深合并，覆盖某个 key 时必须把同 entry
# 的其它 key 一并重写。
# ============================================================

- { id: web-ui-ssh, name: "@linxin666/dsh-ssh", disabled: false }
- { id: web-ui-liangshen, name: "@linxin666/dsh-liangshen", disabled: false }
- {
    id: web-ui-skill-explorer,
    name: "@linxin666/dsh-client-ui-skill-explorer",
    disabled: false
  }
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: web-ui-git-graph
  name: "@linxin666/dsh-client-ui-git-graph"
  config:
    plugin: "@linxin666/dsh-client-ui-git-graph"
    autoIsolate: true
- id: llm-commandcode
  name: "@mars-sea/dsh-commandcode-provider"
  config:
    apiKeyEnv: COMMANDCODE_API_KEY
    visibleModels:
      - deepseek/deepseek-v4.1-flash
      - z-ai/glm-5.3-flash
      - xiaomi/mimo-v2.6-flash
      - xiaomi/mimo-v2.6-pro
    accounts: []
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: commandcode
    model: deepseek/deepseek-v4.1-flash
- id: web-ui-pet
  name: "@linxin666/dsh-pet"
  config:
    visible: true
    size: 160
    right: 31
    bottom: 16
    petId: whale-girl
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: ptc
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    fontSize: 16
